[mutmut]
source_paths =
    scripts
pytest_add_cli_args_test_selection =
    dev
pytest_add_cli_args =
    --ignore=dev/test_purlin_report.py
    --deselect=dev/test_consumer_ci.py::test_the_fixture_is_complete_and_every_file_is_tracked
    --deselect=dev/test_consumer_ci.py::test_the_plugin_copy_is_the_plugin
    --deselect=dev/test_mcp_server.py::TestPackageHygiene::test_every_open_passes_an_encoding
    --deselect=dev/test_mcp_server.py::TestPackageHygiene::test_the_package_imports_nothing_outside_the_standard_library
    --deselect=dev/test_multilang_proof_plugins.py::TestTheRetiredFieldsAreGone::test_the_dropped_languages_have_no_plugin
    --deselect=dev/test_refresh_digest_hook.py::TestRecheckAfterWriting::test_a_write_during_generation_is_picked_up
    --deselect=dev/test_schema_proof_format.py::TestProofFormatConventions::test_the_runtime_directory_is_gitignored
    --deselect=dev/test_security.py::TestSecurityPatterns::test_subprocess_uses_list_args
    --deselect=dev/test_static_checks.py::TestRunsOnWindowsToo::test_all_text_open_calls_specify_utf8
also_copy =
    dev
    specs
    references
    templates
    agents
    skills
    hooks
    docs
    tools
    design
    designs
    .purlin
    .claude-plugin
    .github
    conftest.py
    VERSION
    README.md
    RELEASE_NOTES.md
    CLAUDE.md
    LICENSE
    requirements.txt
    settings.json
    init_e2e.test.sh
    proof_plugins.test.sh

<head>

<title>Purlin board</title>
<style id="purlin-tokens">
:root{

  --purlin-navy-800:#0C3444;
  --purlin-cream-100:#E4DDD4;
  --purlin-blush-200:#E6BEB0;
  --purlin-copper-500:#C0793F;
  --purlin-slate-300:#93AEB8;
  --purlin-slate-200:#BFCED5;
  --purlin-cream-050:#F1ECE5;
  --slate-950:#0F172A;
  --slate-900:#172034;
  --slate-800:#1E293C;
  --slate-750:#263350;
  --slate-700:#334155;
  --slate-500:#64738B;
  --slate-400:#94A2B8;
  --slate-200:#E2E8F0;
  --white:#FFFFFF;
  --green-500:#22C55D;
  --green-600:#269655;
  --green-300:#3AC968;
  --green-100:#C6EDCF;
  --amber-500:#F59E0C;
  --red-500:#EF4444;
  --teal-400:#2DD4BF;
  --green-700:#15803D;
  --amber-700:#B45309;
  --red-700:#B91C1C;

  --purlin-paper-100:#F4EFDF;
  --purlin-paper-200:#E4DDD4;
  --purlin-paper-300:#D3C9BC;
  --purlin-ink-700:#1B4A5C;
  --purlin-ink-500:#4D676F;
}
:root{
  --color-scheme:dark;
  --canvas:var(--purlin-navy-800);
  --canvas-deep:var(--purlin-navy-900);
  --surface-1:rgba(228,221,212,.06);
  --surface-2:rgba(228,221,212,.10);
  --surface-sunken:var(--purlin-navy-900);
  --surface-veil:rgba(228,221,212,.30);
  --text-primary:var(--purlin-cream-050);
  --text-secondary:var(--purlin-blush-200);
  --text-muted:var(--purlin-slate-200);
  --text-accent:var(--purlin-copper-500);
  --text-inverse:var(--purlin-navy-900);
  --border-hairline:rgba(228,221,212,.18);
  --border-default:rgba(228,221,212,.30);
  --border-strong:rgba(228,221,212,.45);
  --border-accent:var(--purlin-copper-500);
  --accent:var(--purlin-copper-500);
  --accent-contrast:var(--purlin-navy-900);
  --state-pass:var(--green-500);
  --state-pass-soft:rgba(34,197,93,.14);
  --state-warn:var(--amber-500);
  --state-warn-soft:rgba(245,158,12,.14);
  --state-fail:var(--red-500);
  --state-fail-soft:rgba(239,68,68,.14);
  --state-neutral:var(--teal-400);
  --state-neutral-soft:rgba(45,212,191,.14);
  --state-idle:var(--slate-400);
  --focus-ring:var(--purlin-blush-200);
  --link:var(--purlin-blush-200);
  --link-hover:var(--purlin-copper-500);
}
[data-theme="light"]{
  --color-scheme:light;
  --canvas:var(--purlin-paper-050);
  --canvas-deep:var(--purlin-paper-100);
  --surface-1:var(--white);
  --surface-2:var(--purlin-paper-100);
  --surface-sunken:var(--purlin-paper-200);
  --surface-veil:rgba(12,52,68,.05);
  --text-primary:var(--purlin-navy-800);
  --text-secondary:var(--purlin-ink-700);
  --text-muted:var(--purlin-ink-500);
  --text-accent:var(--copper-700);
  --text-inverse:var(--purlin-paper-050);
  --border-hairline:rgba(12,52,68,.12);
  --border-default:rgba(12,52,68,.20);
  --border-strong:rgba(12,52,68,.38);
  --border-accent:var(--copper-700);
  --accent:var(--copper-700);
  --accent-contrast:var(--purlin-paper-050);
  --state-pass:var(--green-700);
  --state-pass-soft:rgba(21,128,61,.12);
  --state-warn:var(--amber-700);
  --state-warn-soft:rgba(180,83,9,.12);
  --state-fail:var(--red-700);
  --state-fail-soft:rgba(185,28,28,.12);
  --state-neutral:var(--teal-700);
  --state-neutral-soft:rgba(15,118,110,.12);
  --state-idle:var(--purlin-ink-500);
  --focus-ring:var(--copper-700);
  --link:var(--copper-700);
  --link-hover:var(--purlin-navy-800);
}
:root{
  --font-sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --font-mono:"Courier New",Courier,monospace;
  --type-hero:180px;
  --type-display:98px;
  --type-title:48px;
  --type-subtitle:33px;
  --type-lead:30px;
  --type-body-lg:22.5px;
  --type-body:20.25px;
  --type-body-sm:18px;
  --type-caption:15.75px;
  --type-micro:15px;
  --ui-metric-xl:44px;
  --ui-metric:32px;
  --ui-lg:18px;
  --ui-base:15px;
  --ui-sm:13px;
  --ui-xs:11px;
  --leading-tight:.8;
  --leading-snug:1.12;
  --leading-normal:1.35;
  --leading-relaxed:1.5;
  --tracking-hero:-.006em;
  --tracking-normal:0;
  --tracking-wide:.055em;
  --tracking-label:.12em;
  --weight-regular:400;
  --weight-bold:700;
}
:root{
  --space-0:0;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-8:32px;
  --space-10:40px;
  --space-12:48px;
  --space-16:64px;
  --space-20:80px;
  --space-24:96px;
  --slide-w:1920px;
  --slide-h:1080px;
  --slide-margin-x:200px;
  --slide-title-y:230px;
  --slide-content-w:1672px;
  --slide-rule-w:1520px;
  --slide-row-h:105px;
  --app-bar-h:92px;
  --app-gutter:12px;
  --row-h:76px;
}
:root{
  --radius-none:0;
  --radius-sm:4px;
  --radius-md:6px;
  --radius-pill:999px;
  --border-width-hairline:1px;
  --border-width-default:1.5px;
  --border-width-strong:2px;
}
:root{
  --shadow-none:none;
  --elev-flat:0 0 0 0 transparent;
  --elev-raised:inset 0 0 0 1px var(--border-hairline);
  --elev-focus:0 0 0 2px var(--canvas),0 0 0 4px var(--focus-ring);
  --overlay-scrim:rgba(9,41,54,.72);
  --backdrop-blur:8px;
}
:root{
  --duration-instant:80ms;
  --duration-fast:140ms;
  --duration-base:220ms;
  --duration-slow:420ms;
  --ease-standard:cubic-bezier(.2,0,0,1);
  --ease-out:cubic-bezier(0,0,0,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --hover-tint:rgba(228,221,212,.06);
  --press-tint:rgba(9,41,54,.25);
  --press-scale:.985;
}
@media (prefers-reduced-motion:reduce){
  :root{--duration-instant:0ms;--duration-fast:0ms;--duration-base:0ms;--duration-slow:0ms}
}
html{color-scheme:var(--color-scheme,dark)}
body{margin:0;background:var(--canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--ui-base);line-height:var(--leading-normal);-webkit-font-smoothing:antialiased;text-wrap:pretty}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--border-default);transition:color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}
a:hover{color:var(--link-hover);border-bottom-color:currentColor}
:focus-visible{outline:none;box-shadow:var(--elev-focus)}
code,kbd,pre,samp{font-family:var(--font-mono)}
::selection{background:var(--accent);color:var(--accent-contrast)}

<style>
*,*::before,*::after{box-sizing:border-box}
button{font-family:inherit}

.wrap{max-width:1360px;margin:0 auto;padding:var(--space-8)}
section{margin-bottom:var(--space-10)}

.line{margin:0;font-size:var(--ui-base);font-weight:normal;line-height:inherit;color:var(--text-secondary)}
.line b{font-family:var(--font-mono);font-weight:var(--weight-bold);color:var(--text-primary)}
.sep{color:var(--text-muted);padding:0 var(--space-3)}
.eyebrow{font-size:var(--ui-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-accent);margin:0 0 var(--space-4)}
h1{font-size:var(--ui-metric);font-weight:var(--weight-bold);margin:0 0 var(--space-3);line-height:1.1}
h2{font-size:var(--ui-lg);font-weight:var(--weight-bold);margin:0 0 var(--space-4)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.tag{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:var(--ui-sm);padding:3px 10px;border-radius:var(--radius-sm);border:1px solid var(--accent);color:var(--text-primary);white-space:nowrap}
.tag.plain{border-color:var(--text-muted);color:var(--text-muted)}
.tag.risk-high{border-color:var(--state-fail)}
.tag.risk-medium{border-color:var(--state-warn)}
.tag.risk-low{border-color:var(--text-muted);color:var(--text-muted)}
.os{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:var(--ui-sm);padding:0 5px;border-radius:var(--radius-sm);border:1px solid;margin-right:3px;white-space:nowrap;line-height:1.5}
.os.pass{border-color:var(--state-pass);color:var(--state-pass)}

.btn{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--ui-sm);letter-spacing:.01em;padding:6px 16px;border-radius:var(--radius-pill);border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;transition:background var(--duration-fast) var(--ease-standard)}
.btn:hover{background:var(--hover-tint)}
.btn.glyph{padding:4px 12px;font-size:var(--ui-base);line-height:1}
.panel{background:var(--surface-1);border:1px solid var(--border-hairline);border-radius:var(--radius-sm);padding:var(--space-6)}
.notice{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-6);background:var(--surface-1);border:1px solid var(--border-hairline);border-radius:var(--radius-sm);margin-bottom:var(--space-5);font-size:var(--ui-base);color:var(--text-primary)}
.pill{display:inline-flex;align-items:center;justify-content:center;font-size:var(--ui-xs);font-weight:var(--weight-bold);letter-spacing:.08em;padding:4px 12px;border-radius:var(--radius-pill);border:1.5px solid currentColor;white-space:nowrap}
.pill.solid{background:currentColor}
.pill b{font-weight:var(--weight-bold)}
.pill.solid b{color:var(--canvas-deep)}
.cov{display:inline-flex;align-items:center;gap:var(--space-4);max-width:100%;min-width:0}
.cov b{font-family:var(--font-mono);font-size:var(--ui-sm);font-weight:var(--weight-regular);color:var(--text-primary);white-space:nowrap}
.cov i{width:96px;height:5px;background:var(--border-hairline);border-radius:var(--radius-pill);overflow:hidden;display:inline-block}
.cov i>span{display:block;height:100%;background:currentColor;transition:width var(--duration-slow) var(--ease-out)}
.thumb{display:block;width:60px;height:38px;object-fit:cover;border:1px solid var(--border-hairline);border-radius:var(--radius-sm)}
pre.code{margin:0;font-family:var(--font-mono);font-size:var(--ui-sm);line-height:1.55;color:var(--text-primary);padding:var(--space-5);background:var(--surface-sunken);border:1px solid var(--border-default);border-radius:var(--radius-sm);overflow-x:auto;white-space:pre-wrap}
.strip{display:grid;grid-template-columns:1fr;gap:var(--space-4)}
.strip.flagged{grid-template-columns:5fr 1fr}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--space-4)}
.tile,.flag{background:var(--surface-1);border:1px solid var(--border-hairline);border-radius:var(--radius-md);text-align:center;padding:var(--space-6) var(--space-3)}
.tile-v,.flag-v{font-size:var(--ui-metric);font-weight:var(--weight-bold);line-height:1}

.filters{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-5)}

.trio{display:inline-flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);font-size:var(--ui-sm);white-space:nowrap}
.trio b{font-weight:var(--weight-regular)}
.trio i,.rsum i{color:var(--text-muted);font-style:normal}
.run{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2) var(--space-3);min-width:0}
.run .mono{font-size:var(--ui-sm);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr>div .cov i{flex:0 1 96px;min-width:24px}
.th{font-size:var(--ui-xs);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
.tr{cursor:pointer;transition:background var(--duration-fast) var(--ease-standard)}
.tr:hover{background:var(--hover-tint)}
.tbl>:last-child{border-bottom:0}
.group{display:flex;align-items:center;gap:var(--space-5);padding:var(--space-4) var(--space-6);background:var(--surface-2);border-bottom:1px solid var(--border-hairline);cursor:pointer}
.group .gt{font-weight:var(--weight-bold);font-size:var(--ui-base);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-primary)}
.caret{color:var(--text-muted);font-size:10px;flex:none}
.name{display:inline-flex;align-items:center;gap:var(--space-4);min-width:0}
.name .n{font-size:var(--ui-base);color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{display:grid;grid-template-columns:96px 1fr auto;gap:var(--space-4);align-items:start;padding:var(--space-3) var(--space-6) var(--space-3) var(--space-12);border-bottom:1px solid var(--border-hairline);background:var(--surface-sunken);cursor:pointer;font-size:var(--ui-sm)}
.rule:hover{background:var(--hover-tint)}
.rule .rid{font-family:var(--font-mono);color:var(--text-primary)}
.rule .rt{color:var(--text-secondary)}
.rule .rp{display:inline-flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;justify-content:flex-end}

.empty{padding:var(--space-12);text-align:center;color:var(--text-secondary);font-size:var(--ui-lg)}

.kv dd{margin:0;color:var(--text-primary);min-width:0;overflow-wrap:anywhere}
.stack>*+*{margin-top:var(--space-5)}
.finding{font-size:var(--ui-sm);color:var(--state-warn)}
.cmd{font-family:var(--font-mono);font-size:var(--ui-base);color:var(--text-secondary);white-space:nowrap}
.panel p{margin:0 0 var(--space-3)}
.panel p:last-child{margin-bottom:0}

.rsum b{font-family:var(--font-mono);font-weight:var(--weight-bold);color:var(--text-primary)}
</style>

<script>
'use strict';
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light'
    ? 'light' : 'dark';
}
function restoreTheme() {
  var saved = null;
  try { saved = localStorage.getItem('purlin-theme'); } catch (e) {}
  document.documentElement.setAttribute(
    'data-theme', saved === 'light' ? 'light' : 'dark');
}
function toggleTheme() {
  var next = currentTheme() === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('purlin-theme', next); } catch (e) {}
}
function logoSrc() {
  return currentTheme() === 'light' ? PURLIN_LOGO.light : PURLIN_LOGO.dark;
}
function themeButton() {
  var next = currentTheme() === 'light' ? 'Dark theme' : 'Light theme';
  return '<button class="btn glyph" data-act="theme" title="' + next
    + '" aria-label="' + next + '">\u25d0</button>';
}
var FILTERS = [
  {id: 'untested', label: 'Untested', level: 'passed',
   test: function (rule) { return rule.bucket === 'untested'; }},
  {id: 'failing', label: 'Failing', level: 'passed',
   test: function (rule) { return rule.bucket === 'failing'; }},
  {id: 'weak', label: 'Weak', level: 'strong',
   test: function (rule) { return cellWord(rule, 'strong') === 'weak'; }},
  {id: 'unsigned', label: 'Unsigned', level: 'signed',
   test: function (rule) { return cellWord(rule, 'signed') === 'unsigned'; }},
  {id: 'stale-or-held', label: 'Stale or held', level: 'signed',
   test: function (rule) {
     var flags = rule.flags || {};
     return !!flags.stale || !!flags.held;
   }}
];
function findingsOf(rule) {
  var found = [];
  (rule.proofs || []).forEach(function (proof) {
    (proof.findings || []).forEach(function (name) {
      if (found.indexOf(name) < 0) { found.push(name); }
    });
  });

function recordsFor(feature) {
  var byOs = (DATA.records || {})[feature.name] || {};
  return Object.keys(byOs).sort().map(function (key) { return byOs[key]; });
}
var OS_BOXES = [['linux', 'linux'], ['macos', 'mac'], ['windows', 'win']];
function newestByOs(feature) {
  var byOs = {};
  recordsFor(feature).forEach(function (record) {
    var os = record.os || '';
    if (!byOs[os] || (record.timestamp || '') > (byOs[os].timestamp || '')) {
      byOs[os] = record;
    }
  });
  return byOs;
}
function osBox(os, short, record) {
  if (!record) {
    return '<span class="os none" title="' + esc(os) + ': no record">'
      + esc(short) + '</span>';
  }
  var hue = record.result === 'fail' ? 'fail' : 'pass';
  var who = record.label || 'local';
  return '<span class="os ' + hue + '" title="' + esc(os + ': ' + who + ' '
    + (hue === 'fail' ? 'failed' : 'passed') + ' at ' + (record.timestamp || '')
    + ' · ' + (record.path || '')) + '">' + esc(short) + '</span>';
}
function recordCell(feature) {
  var byOs = newestByOs(feature);
  return OS_BOXES.map(function (pair) {
    return osBox(pair[0], pair[1], byOs[pair[0]]);
  }).join('');
}
function sourceOf(feature) {
  var found = null;
  (feature.rules || []).forEach(function (rule) {
    var cell = (rule.cells || {}).passed || {};
    if (!found && cell.source) { found = cell.source; }
  });
  return found;
}
function lastRun(feature) {
  var record = (feature.rollup || {}).latest_record || feature.latest_record;
  var text;
  if (record) {
    text = '<span class="mono sec">' + esc((record.label || 'local') + ' · '
      + ageText(record.timestamp).text) + '</span>';
  } else if (sourceOf(feature)) {
    text = '<span class="mono sec">' + esc(sourceOf(feature)) + '</span>';
  } else {
    text = '<span class="mono muted">—</span>';
  }
  return '<span class="run">' + recordCell(feature) + text + '</span>';
}
function recordLine(feature) {
  var byOs = newestByOs(feature);
  var record = (feature.rollup || {}).latest_record || feature.latest_record;
  if (!record && !sourceOf(feature)) {
    return '<span class="mono muted">—</span>';
  }
  var boxes = OS_BOXES.map(function (pair) {
    var found = byOs[pair[0]];
    return osBox(pair[0], pair[1], found)
      + (found ? ' ' + hostLink(found.path, found.timestamp || found.path) : '');
  }).join(' ');
  return boxes + ' ' + (record
    ? hostLink(record.path, (record.label || 'local') + ' · '
        + ageText(record.timestamp).text)
    : '<span class="mono sec">' + esc(sourceOf(feature)) + '</span>');
}
function hostLink(path, text) {
  var base = webRemote();
  var label = esc(text || path);
  if (!base || !path) { return '<span class="mono">' + label + '</span>'; }
  return '<a class="mono" href="' + esc(base + '/blob/'
    + (DATA.commit || 'HEAD') + '/' + path) + '">' + label + '</a>';
}
function webRemote() {
  var remote = DATA && DATA.remote_url;
  if (!remote) { return null; }
  remote = String(remote).replace(/\.git$/, '')
    .replace(/^git@([^:]+):/, 'https://$1/');
  return remote.indexOf('github.com') >= 0 ? remote : null;
}
function designThumb(feature) {
  var files = (feature.source_globs || []).concat(
    feature.source_path ? [feature.source_path] : []);
  for (var i = 0; i < files.length; i++) {
    var file = String(files[i]);
    if (/[*?\[]/.test(file)) { continue; }
    if (/\.(png|jpg|jpeg|svg|webp)$/i.test(file)) {
      return '<img class="thumb" src="' + esc(file) + '" alt="'
        + esc(feature.name + ' design') + '" onerror="this.remove()">';
    }
  }
  return '';
}
function ageText(iso) {
  var then = Date.parse(iso || '');
  if (!then) { return {text: 'age unknown', stale: true}; }
  var seconds = Math.max(0, (Date.now() - then) / 1000);
  if (seconds < 90) { return {text: 'less than a minute old', stale: false}; }
  if (seconds < 5400) {
    return {text: Math.round(seconds / 60) + ' minutes old', stale: false};
  }
  if (seconds < 172800) {
    return {text: Math.round(seconds / 3600) + ' hours old', stale: true};
  }
  return {text: Math.round(seconds / 86400) + ' days old', stale: true};
}
function eachRule(visit) {
  (DATA.features || []).forEach(function (feature) {
    (feature.rules || []).forEach(function (rule) { visit(rule, feature); });
  });
}
function cellOf(rule, name) {
  return (rule.cells || {})[name] || null;
}
function cellWord(rule, name) {
  var cell = cellOf(rule, name);
  return cell ? cell.word : null;
}
function featureNamed(name) {
  var found = null;
  (DATA.features || []).forEach(function (feature) {
    if (feature.name === name) { found = feature; }
  });
  return found;
}
function ageLine() {
  var age = ageText(DATA && DATA.generated_at);
  return {hue: age.stale ? 'warn' : 'pass',
          text: 'Data: ' + age.text
            + (age.stale ? ' — run purlin:status to refresh' : '')};
}
function topBar() {
  var line = ageLine();
  var gate = DATA && DATA.gate ? DATA.gate.gate : null;
  return '<header class="topbar"><span class="brand"><img id="brand-mark" src="'
    + logoSrc() + '" alt="Purlin"><span>purlin</span></span>'
    + '<button class="btn fresh" data-act="reload" '
    + 'style="color:var(--state-' + line.hue + ')">'
    + '<span class="dot"></span><span class="age">' + esc(line.text)
    + '</span></button>'
    + '<span class="spacer"></span>'
    + (gate ? tag('gate: ' + gate, true) : '')
    + (DATA && DATA.commit
       ? '<span class="tag plain" title="The commit this data was generated at">at '
         + esc(String(DATA.commit).slice(0, 7)) + '</span>' : '')
    + themeButton() + '</header>';
}
function tabs() {
  var open = VIEW.screen;
  var items = [['board', 'Board']];
  if (level('strong')) {
    items.push(['review',
                'Review list (' + (DATA.review_list || []).length + ')']);
  }
  if (VIEW.rule) { items.push(['rule', VIEW.feature + ' ' + VIEW.rule]); }
  return '<nav class="tabs">' + items.map(function (item) {
    return '<button data-act="nav" data-screen="' + item[0] + '"'
      + (open === item[0] ? ' aria-current="page"' : '') + '>'
      + esc(item[1]) + '</button>';
  }).join('') + '</nav>';
}
function notices() {
  var lines = [];
  if (DATA.dirty) {
    lines.push('The working tree has uncommitted changes, so what is on this '
      + 'board is not what a commit would carry.');
  }
  (DATA.warnings || []).forEach(function (warning) { lines.push(warning); });
  return lines.map(function (line) {
    return '<div class="notice"><span class="dot" '
      + 'style="color:var(--state-warn)"></span>' + esc(line) + '</div>';
  }).join('');
}
function render() {
  var app = document.getElementById('app');
  if (!DATA) {
    app.innerHTML = '<div class="wrap"><div class="empty">No board data yet. '
      + 'Run purlin:status to write .purlin/report-data.js, then reload this '
      + 'page.</div></div>';
    return;
  }
  if (DATA.schema_version !== SCHEMA) {
    app.innerHTML = topBar() + '<div class="wrap"><div class="notice">'
      + esc('This data was written for schema ' + DATA.schema_version
        + ' and this page reads schema ' + SCHEMA
        + '. Run purlin:status to write it again.') + '</div></div>';
    return;
  }
  if (VIEW.screen === 'review' && !level('strong')) { VIEW.screen = 'board'; }
  var body = VIEW.screen === 'rule' ? renderRule()
    : VIEW.screen === 'review' ? renderReview()
    : notices() + renderBoard();
  app.innerHTML = topBar() + tabs() + '<div class="wrap">' + body + '</div>';
}
function onClick(event) {
  var node = event.target;
  while (node && node !== document && !node.getAttribute('data-act')) {
    node = node.parentNode;
  }
  if (!node || node === document) { return; }
  var act = node.getAttribute('data-act');
  if (act === 'theme') { toggleTheme(); }
  else if (act === 'reload') { reloadPage(); return; }
  else if (act === 'nav') { VIEW.screen = node.getAttribute('data-screen'); }
  else if (act === 'close') {
    VIEW.screen = node.getAttribute('data-screen') || 'board';
    VIEW.rule = null;
    VIEW.feature = null;
  }
  else if (act === 'filter') {
    var id = node.getAttribute('data-filter');
    VIEW.filters[id] = !VIEW.filters[id];
  } else if (act === 'group') {
    var group = node.getAttribute('data-group');
    VIEW.groups[group] = VIEW.groups[group] === false;
  } else if (act === 'feature') {
    var name = node.getAttribute('data-feature');
    VIEW.features[name] = !VIEW.features[name];
  } else if (act === 'rule') {
    VIEW.from = VIEW.screen === 'review' ? 'review' : 'board';
    VIEW.feature = node.getAttribute('data-feature');
    VIEW.rule = node.getAttribute('data-rule');
    VIEW.screen = 'rule';
  }
  render();
}
function restoreView() {
  var saved = null;
  try { saved = sessionStorage.getItem('purlin-view'); } catch (e) {}
  try { sessionStorage.removeItem('purlin-view'); } catch (e) {}
  if (!saved) { return; }
  try {
    var value = JSON.parse(saved);
    if (value && typeof value === 'object') { VIEW = value; }
  } catch (e) {}
}
function reloadPage() {
  try { sessionStorage.setItem('purlin-view', JSON.stringify(VIEW)); }
  catch (e) {}
  location.reload();
}
function tickAge() {
  if (!DATA) { return; }
  var node = document.querySelector('.topbar .fresh');
  var text = node && node.querySelector('.age');
  if (!text) { return; }
  var line = ageLine();
  node.style.color = 'var(--state-' + line.hue + ')';
  text.textContent = line.text;
}
function refreshIfStale() {
  var then = Date.parse((DATA && DATA.generated_at) || '');
  if (!then || (Date.now() - then) / 1000 <= REFRESH_AFTER) { return; }
  var stamp = String(DATA.generated_at);
  var last = null;
  try { last = sessionStorage.getItem('purlin-reloaded'); } catch (e) {}
  if (last === stamp) { return; }
  try { sessionStorage.setItem('purlin-reloaded', stamp); } catch (e) {}
  reloadPage();
}
restoreTheme();
restoreView();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { refreshIfStale(); }
});
window.addEventListener('focus', refreshIfStale);
setInterval(tickAge, REFRESH_AFTER * 1000);
document.getElementById('app').addEventListener('click', onClick);
loadData(function (payload) {
  DATA = payload;
  render();
});
</script>
</body>
</html>

name: verify-gate

# Runs the deterministic verification gate: scripts/ci/verify_gate.py --check reads
# the structured status payload and decides whether the branch may merge.
#
# DECLARATION VERSUS ENFORCEMENT
#   The `remote_verification` field in .purlin/config.json DECLARES the mode. This
#   workflow reads that declaration and exits 0 or 1 accordingly. Neither the field
#   nor this file is the enforcement: both are in the repository, where the agent can
#   edit them. Enforcement is branch protection marking this job a required check,
#   plus auto-merge gated on it, which lives in the forge and not in the tree.
#   See docs/regulated-environments.md ("Policy lives outside the repo") and
#   references/remote_verification.md.
#
#   This repo declares "optional", so the job reports findings and passes. Declaring
#   "required" is what turns the same findings into an exit 1.
#
# Governed by specs/ci/verify_gate.md (RULE-1 through RULE-9).

on:
  push:
    paths:
      - 'specs/**'
      - '.purlin/config.json'
      - 'scripts/ci/verify_gate.py'
      - 'scripts/mcp/purlin_server.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'specs/**'
      - '.purlin/config.json'
      - 'scripts/ci/verify_gate.py'
      - 'scripts/mcp/purlin_server.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  verify-gate:
    runs-on: ubuntu-latest
    env:
      # Where the Purlin tooling is checked out. In the purlin repository
      # itself set this to `.` and delete the "Install Purlin tooling" step
      # below: that repository is the plugin.
      PURLIN_PLUGIN_ROOT: ${{ runner.temp }}/purlin
    steps:
      # Full history: the gate's payload includes runner provenance, which
      # sync_status reads with `git log -1` on each platform-scoped proof file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Purlin tooling
        # A consumer checkout holds specs, proofs, receipts and `.purlin/`, and
        # no Purlin `scripts/`. Pin the tag: an unpinned clone changes what the
        # preflight enforces between one run and the next.
        shell: bash
        run: |
          git clone --depth 1 --branch two-gauges-remote-verification \
            https://github.com/rlabarca/purlin.git "$PURLIN_PLUGIN_ROOT"

      # Prints the declared mode, the enforcement note, and every finding, so the
      # job log is the record of what the gate saw and why it decided as it did.
      - name: Run the verification gate
        shell: bash
        run: python3 "$PURLIN_PLUGIN_ROOT/scripts/ci/verify_gate.py" --check --project-root .


name: windows-proofs

# Runs the Windows-native proofs for static_checks (RULE-29/30) on a real windows-latest
# runner and commits the emitted `windows`-tier proof file back to the branch, so
# purlin:verify/purlin:status can read genuine Windows verification — not host simulation.

on:
  push:
    # Skip the runner's own proof commit (loop guard, paired with [skip ci]).
    paths-ignore:
      - '**/*.proofs-windows.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-native:
    runs-on: windows-latest
    env:
      # This repository is the plugin, so the tooling root is the checkout
      # itself and the template's "Install Purlin tooling" step is not needed.
      PURLIN_PLUGIN_ROOT: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Preflight
        # Fails the job when the project's plugin copies are stale or a legacy
        # migration is pending: stale copies predate platform scoping and write
        # agnostic proof files that satisfy no platform, so the run would look
        # green and prove nothing (specs/ci/verify_gate.md RULE-11).
        # -> Run: purlin:init --update and commit
        shell: bash
        run: python3 "$PURLIN_PLUGIN_ROOT/scripts/update/migrate.py" --check --project-root .

      - name: Run Windows-native proofs
        shell: bash
        run: python -m pytest dev/test_windows_native.py -v

      - name: Commit Windows proof file back to the branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add specs/audit/static_checks.proofs-windows.json
          if git diff --cached --quiet; then
            echo "No proof-file changes to commit."
          else
            # The Purlin-Runner trailer is the only record of which runner
            # proved these: proof entries carry no such field, by design, so
            # that `git diff --cached --quiet` above stays an accurate
            # idempotency check. sync_status reads the trailer back with
            # `git log -1` (specs/mcp/sync_status.md RULE-48). Without it the
            # report reads "runner not recorded", which is a gap, not a state.
            # The Purlin-Platform trailer names the platform id the file is
            # scoped to, so sync_status can cross-check it against the filename.
            # Both required by specs/ci/verify_gate.md RULE-7.
            git commit -m "test(static_checks): windows-native proofs from windows-latest [skip ci]" \
                       -m "Purlin-Runner: github-actions/windows-latest" \
                       -m "Purlin-Platform: windows"
            # Several platform runners may commit to this branch at once, so
            # the first push can lose a race it did nothing wrong to lose.
            # Three attempts, then fail: a genuinely broken push stays a
            # failure (specs/ci/verify_gate.md RULE-10).
            for attempt in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && \
                 git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "push attempt $attempt lost a race; retrying"
            done
            echo "could not push the proof commit after 3 attempts"
            exit 1
          fi

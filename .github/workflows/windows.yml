# This repository's own Windows run. It is here for one reason: the proofs in
# specs/ tagged @env(windows), which the owner's Mac cannot prove. Purlin ships
# no such file; this one is this project's own setup.
#
# One thing starts a run and nothing else does: a push to a `run/*` branch,
# which is the branch `python3 dev/windows_run.py` creates and deletes around
# one run. A push to any other branch starts nothing, a tag starts nothing,
# and a pull request starts nothing.
#
# A run starts the tests of the proofs tagged @env(windows), writes the Windows
# section of .purlin/evidence/ci/<feature>.json for every feature it covered,
# and commits those files alone as `purlin: evidence at <sha7>`. The last step
# pushes that commit to the run branch, after a failed run as after a passing
# one, and dev/windows_run.py pulls it home. The push is made with the job's
# own token, so it starts no further run.
#
# The job fails only when one of those tests failed or could not run.
#
# No audit runs here. purlin:audit runs on a person's machine.
#
# The job is capped at 90 minutes. GitHub cancels a job at 6 hours and
# keeps nothing, so a run that stops for something cannot be read; 90 minutes
# is longer than any suite this runs and short enough to leave a log worth
# reading. The run caps each test command at an hour of its own.
name: windows

on:
  push:
    branches: ['run/**']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The tests a run starts here are this repository's pytest files. They
      # import pytest and the standard library alone.
      - name: Install what the tests need
        shell: bash
        run: python3 -m pip install pytest

      # The commit --commit makes is an ordinary git commit, so it needs a name
      # and an email. The email is also what each result records as who ran it.
      - name: Run the tests tagged for Windows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/run/purlin_run.py --ci --commit

      - name: Return the evidence
        if: always()
        shell: bash
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--canvas)}.sw{display:flex;gap:0;border-radius:4px;overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font:400 10px/1.3 var(--font-mono)}.grid{display:flex;gap:12px}.k{font:400 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.04em}</style></head><body><div class="sw"><div style="background:#22C55D;color:#0F172A"><span>pass</span><span style="opacity:.7">#22C55D</span></div><div style="background:#F59E0C;color:#0F172A"><span>warn</span><span style="opacity:.7">#F59E0C</span></div><div style="background:#EF4444;color:#0F172A"><span>fail</span><span style="opacity:.7">#EF4444</span></div><div style="background:#2DD4BF;color:#0F172A"><span>neutral</span><span style="opacity:.7">#2DD4BF</span></div><div style="background:#94A2B8;color:#0F172A"><span>idle</span><span style="opacity:.7">#94A2B8</span></div></div></body></html>

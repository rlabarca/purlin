<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--canvas)}.sw{display:flex;gap:0;border-radius:4px;overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font:400 10px/1.3 var(--font-mono)}.grid{display:flex;gap:12px}.k{font:400 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.04em}</style></head><body>
<div class="sw"><div style="background:#F7F4EF;color:#0C3444"><span>paper 050</span><span style="opacity:.7">#F7F4EF</span></div><div style="background:#EFEAE2;color:#0C3444"><span>paper 100</span><span style="opacity:.7">#EFEAE2</span></div><div style="background:#E4DDD4;color:#0C3444"><span>paper 200</span><span style="opacity:.7">#E4DDD4</span></div><div style="background:#D3C9BC;color:#0C3444"><span>paper 300</span><span style="opacity:.7">#D3C9BC</span></div><div style="background:#4D676F;color:#0C3444"><span>ink 500</span><span style="opacity:.7">#4D676F</span></div><div style="background:#1B4A5C;color:#0C3444"><span>ink 700</span><span style="opacity:.7">#1B4A5C</span></div><div style="background:#0C3444;color:#0C3444"><span>navy 800</span><span style="opacity:.7">#0C3444</span></div></div>

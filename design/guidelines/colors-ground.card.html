<!-- @dsCard group="Colors" viewport="700x150" name="Grounds and veils" subtitle="Depth is made from tint steps, never shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--canvas)}.sw{display:flex;gap:0;border-radius:4px;overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font:400 10px/1.3 var(--font-mono)}.grid{display:flex;gap:12px}.k{font:400 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.04em}</style></head><body>
<div class="grid">
<div style="flex:1"><div style="height:64px;background:var(--canvas-deep);border-radius:4px"></div><div class="k" style="margin-top:6px">--canvas-deep</div></div>
<div style="flex:1"><div style="height:64px;background:var(--canvas);border-radius:4px"></div><div class="k" style="margin-top:6px">--canvas</div></div>
<div style="flex:1"><div style="height:64px;background:var(--canvas)"><div style="height:100%;background:var(--surface-1);border:1px solid var(--border-hairline);border-radius:4px;box-sizing:border-box"></div></div><div class="k" style="margin-top:6px">--surface-1 · 6%</div></div>
<div style="flex:1"><div style="height:64px;background:var(--canvas)"><div style="height:100%;background:var(--surface-2);border:1.5px solid var(--border-default);border-radius:4px;box-sizing:border-box"></div></div><div class="k" style="margin-top:6px">--surface-2 · 10%</div></div>
<div style="flex:1"><div style="height:64px;background:var(--canvas)"><div style="height:100%;background:var(--surface-veil)"></div></div><div class="k" style="margin-top:6px">--surface-veil · 30%</div></div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--canvas)}.sw{display:flex;gap:0;border-radius:4px;overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font:400 10px/1.3 var(--font-mono)}.grid{display:flex;gap:12px}.k{font:400 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.04em}@keyframes fill{from{width:0}to{width:78%}}</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:16px"><div style="width:220px;height:5px;background:var(--border-hairline);border-radius:999px;overflow:hidden"><div style="height:100%;background:var(--state-pass);animation:fill 420ms cubic-bezier(0,0,0,1) infinite alternate"></div></div><span class="k">--duration-slow · --ease-out · bar fill</span></div>
<div class="k">--duration-fast 140ms · hover tint · --ease-standard</div>
<div class="k">--press-scale .985 · press darkens rather than lifts</div>
<div class="k">no entrance animations, no parallax, no bounce</div>
</div></body></html>

# Purlin runs here, on a clean machine, for one of two reasons and no others.
#
# purlin:init writes this file for a project whose git host is Azure DevOps,
# and only when one of them holds: a proof in specs/ is tagged @env for an
# operating system your machine is not, or you answered no to init's trust
# question and the project reads `trust: remote`. A project that trusts its
# own machine and names no other operating system gets no pipeline at all.
#
# Two things start a run and nothing else does: a push to a `run/*` branch,
# which is the branch purlin:test --remote creates and deletes around one run,
# and a push of a `signed/*` tag, which is what purlin:sign writes when every
# rule meets the gate. A pull request starts nothing.
#
# A run branch run runs the tagged tests and, at the gate strong and above,
# writes one record per feature under .purlin/records/ci/ with the briefs
# beside it and commits them on that branch. The build service writes them, so
# give it Contribute on .purlin/records/ci/** and .purlin/briefs/ci/** through
# branch security and give it nothing else. A tag run writes nothing: it runs
# the tagged tests, checks that every committed record, brief and signature
# still hashes to the tagged code, checks that every ci/ record and brief was
# committed by the build service, and ends with the gate check.
#
# No breaks run here. Test strength is measured by purlin:audit on a person's
# machine, and a record either source wrote counts at every gate.
#
# The matrix always carries ubuntu-latest first, then one job per operating
# system the `@env` tags in specs/ name; a project that tags nothing runs on
# ubuntu-latest alone.
#
# The job is capped at 90 minutes, which is longer than any suite this
# runs and short enough to leave a log worth reading when a run stops for
# something. The run caps each arm at an hour of its own.
trigger:
  branches:
    include:
      - run/*
  tags:
    include:
      - signed/*

pr: none

jobs:
  - job: purlin
    timeoutInMinutes: 90
    strategy:
      matrix:
<<MATRIX>>
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 0

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'

      # This repository is its own plugin, so a checkout that already carries
      # scripts/run/purlin_run.py is the Purlin to run. A consumer project
      # installed Purlin from the marketplace and its agent has no plugin, so
      # the job clones the release the project pins. Set the PURLIN_REF
      # pipeline variable to move that pin without editing this file.
      - bash: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "##vso[task.setvariable variable=PURLIN_ROOT]$PWD"
          else
            ref="$(PURLIN_REF)"
            if [ -z "$ref" ] || [ "$ref" = "\$(PURLIN_REF)" ]; then
              ref="<<PURLIN_REF>>"
            fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$(Agent.TempDirectory)/purlin"
            echo "##vso[task.setvariable variable=PURLIN_ROOT]$(Agent.TempDirectory)/purlin"
          fi
        displayName: Locate Purlin

      # What each framework needs before its tests run. A project with none of
      # these files installs nothing and the step is a no-op. A project whose
      # tests drive a browser through playwright also needs the browser:
      # `--with-deps` installs the libraries a Linux runner lacks and does
      # nothing on Windows and macOS.
      - bash: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          if [ -f conftest.py ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python3 -m pip install pytest
          fi
          if python3 -c "import playwright" 2>/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi
          if [ -f package.json ]; then npm ci; fi
        displayName: Set up the test framework

      - bash: python3 "$PURLIN_ROOT/scripts/run/purlin_run.py" --all --ci
        displayName: Run the tagged tests
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      # The last word of every run. The gate check exits 1 when a rule does
      # not meet the gate or when a committed record, brief or signature no
      # longer hashes to this code, which fails this job.
      - bash: python3 "$PURLIN_ROOT/scripts/ci/gate_check.py" --check --verify
        displayName: Check the gate

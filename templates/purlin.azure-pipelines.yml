# Purlin runs here, on a clean machine, for one reason: a rule that must hold
# on an operating system your machine is not.
#
# purlin:init writes this file for a project whose git host is Azure DevOps,
# and only when a proof in specs/ is tagged @env for such a system. The
# matrix holds one job for each operating system the @env tags in specs/
# name, and no other. A project whose tags name only the system it is
# developed on gets no pipeline at all.
#
# Two things start a run and nothing else does: a push to a `run/*` branch,
# which is the branch purlin:test --remote creates and deletes around one run,
# and a push of a `signed/*` tag, which purlin:sign writes at the gate signed
# when nothing is left to do. A pull request starts nothing.
#
# A run branch run runs the marked tests a runner runs (references/hard_gates.md
# in the Purlin plugin, "Where a runner runs"), writes its own operating
# system's section of .purlin/evidence/ci/<feature>.json for every feature,
# and commits it on that branch. The build service writes it with
# $(System.AccessToken), and nothing on the host has to be configured for
# that. A tag run runs the same tests and writes nothing.
#
# The test step is the last step. It ends by printing the summary and Left to
# do, and its exit code is the job's: the job fails only when a test fails or
# could not run. A rule not yet audited or signed never fails it.
#
# No breaks and no AI audit run here. purlin:audit does both on a person's
# machine, and the evidence either source wrote counts at every gate.
#
# The job is capped at 90 minutes, which is longer than any suite this
# runs and short enough to leave a log worth reading when a run stops for
# something. The run caps each arm at an hour of its own.
trigger:
  branches:
    include:
      - run/*
  tags:
    include:
      - signed/*

pr: none

jobs:
  - job: purlin
    timeoutInMinutes: 90
    strategy:
      matrix:
<<MATRIX>>
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 0

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'

      # This repository is its own plugin, so a checkout that already carries
      # scripts/run/purlin_run.py is the Purlin to run. A consumer project
      # installed Purlin from the marketplace and its agent has no plugin, so
      # the job clones the release the project pins. Set the PURLIN_REF
      # pipeline variable to move that pin without editing this file.
      - bash: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "##vso[task.setvariable variable=PURLIN_ROOT]$PWD"
          else
            ref="$(PURLIN_REF)"
            if [ -z "$ref" ] || [ "$ref" = "\$(PURLIN_REF)" ]; then
              ref="<<PURLIN_REF>>"
            fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$(Agent.TempDirectory)/purlin"
            echo "##vso[task.setvariable variable=PURLIN_ROOT]$(Agent.TempDirectory)/purlin"
          fi
        displayName: Locate Purlin

      # What each framework needs before its tests run. A project with none of
      # these files installs nothing and the step is a no-op. A project whose
      # tests drive a browser through playwright also needs the browser:
      # `--with-deps` installs the libraries a Linux runner lacks and does
      # nothing on Windows and macOS.
      - bash: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          if [ -f conftest.py ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python3 -m pip install pytest
          fi
          if python3 -c "import playwright" 2>/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi
          if [ -f package.json ]; then npm ci; fi
        displayName: Set up the test framework

      # A Windows agent has no sqlite3, the program a test command that runs
      # SQL scripts starts. Where a tracked file other than this one names
      # sqlite3, this installs it through chocolatey, which the image carries,
      # and puts the folder holding sqlite3.exe on the search path of the
      # steps after it. On Linux and macOS, and where sqlite3 is already
      # found, it installs nothing.
      - bash: |
          if [ "$AGENT_OS" = Windows_NT ] && ! command -v sqlite3 >/dev/null 2>&1 \
              && git grep -qIw sqlite3 -- . ':(exclude)purlin.azure-pipelines.yml'; then
            choco install sqlite -y --no-progress
            lib="$(cygpath -u "${ChocolateyInstall:-C:/ProgramData/chocolatey}")/lib"
            exe=$(find "$lib" -iname sqlite3.exe -print -quit)
            if [ -z "$exe" ]; then
              echo "The sqlite install finished and no sqlite3.exe is under $lib."
              exit 1
            fi
            echo "##vso[task.prependpath]$(cygpath -w "$(dirname "$exe")")"
            "$exe" -version
          fi
        displayName: Install sqlite3 on Windows

      - bash: python3 "$PURLIN_ROOT/scripts/run/purlin_run.py" --all --ci
        displayName: Run the tests
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

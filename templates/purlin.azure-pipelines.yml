# Purlin runs here, on a clean machine, for one reason: a rule that must hold
# on an operating system your machine is not.
#
# The first purlin:test --remote writes this file for a project whose git
# host is Azure DevOps, where a proof in specs/ is tagged @env for such a
# system. The matrix holds one job for each operating system a proof in
# specs/ is tagged @env for that the machine writing the file is not, and no
# other.
#
# One thing starts a run and nothing else does: a push to a `run/*` branch,
# which is the branch purlin:test --remote creates and deletes around one run.
# A tag starts nothing, and a pull request starts nothing.
#
# A run runs the marked tests of the proofs tagged @env for the agent's own
# operating system, writes that system's section of
# .purlin/evidence/ci/<feature>.json for every feature it covered, and commits
# it on the run branch. The build service writes it with
# $(System.AccessToken), and nothing on the host has to be configured for
# that.
#
# The test step is the last step. It ends by printing the summary and Left to
# do, and its exit code is the job's: the job fails only when a test fails or
# could not run.
#
# No breaks and no AI audit run here. purlin:audit does both on a person's
# machine.
#
# The job is capped at 90 minutes, which is longer than any suite this
# runs and short enough to leave a log worth reading when a run stops for
# something. The run caps each test command at an hour of its own.
trigger:
  branches:
    include:
      - run/*

pr: none

jobs:
  - job: purlin
    timeoutInMinutes: 90
    strategy:
      matrix:
<<MATRIX>>
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 0

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'

      # This repository is its own plugin, so a checkout that already carries
      # scripts/run/purlin_run.py is the Purlin to run. A consumer project
      # installed Purlin from the marketplace and its agent has no plugin, so
      # the job clones the release the project pins. Set the PURLIN_REF
      # pipeline variable to move that pin without editing this file.
      - bash: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "##vso[task.setvariable variable=PURLIN_ROOT]$PWD"
          else
            ref="$(PURLIN_REF)"
            if [ -z "$ref" ] || [ "$ref" = "\$(PURLIN_REF)" ]; then
              ref="<<PURLIN_REF>>"
            fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$(Agent.TempDirectory)/purlin"
            echo "##vso[task.setvariable variable=PURLIN_ROOT]$(Agent.TempDirectory)/purlin"
          fi
        displayName: Locate Purlin

      # What each framework needs before its tests run. A project with none of
      # these files installs nothing and the step is a no-op. A project whose
      # tests drive a browser through playwright also needs the browser:
      # `--with-deps` installs the libraries a Linux/Unix runner lacks and does
      # nothing on Windows and macOS.
      - bash: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          if [ -f conftest.py ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python3 -m pip install pytest
          fi
          if python3 -c "import playwright" 2>/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi
          if [ -f package.json ]; then npm ci; fi
        displayName: Set up the test framework

      - bash: python3 "$PURLIN_ROOT/scripts/run/purlin_run.py" --all --ci
        displayName: Run the tests
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

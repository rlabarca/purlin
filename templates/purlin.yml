# Purlin runs here, on a clean machine, for one of two reasons and no others.
#
# purlin:init writes this file only when one of them holds: a proof in specs/
# is tagged @env for an operating system your machine is not, or you answered
# no to init's trust question and the project reads `trust: remote`. A project
# that trusts its own machine and names no other operating system gets no
# workflow at all: at the gate signed purlin:sign writes the tag, you push it,
# and nothing runs remotely.
#
# Two things start a run and nothing else does: a push to a `run/*` branch,
# which is the branch purlin:test --remote creates and deletes around one run,
# and a push of a `signed/*` tag, which purlin:sign writes only at the gate
# signed, when every rule meets it, so only a project at signed starts a tag
# run. A push to any other branch starts nothing, and a pull request starts
# nothing.
#
# A run branch run runs the marked tests, writes its own operating system's
# section of .purlin/evidence/ci/<feature>.json for every feature, and commits
# it on that branch, where purlin:test --remote pulls it home. A tag run writes
# nothing: it runs the marked tests, checks that every committed signature
# still hashes to the tagged code, checks that every file under
# .purlin/evidence/ci/ was committed by the runner itself, and ends with the
# gate check.
#
# No breaks and no AI audit run here. purlin:audit does both on a person's
# machine, and the evidence either source wrote counts at every gate.
#
# Every run ends with the gate check, and the job fails when the gate is not
# met.
#
# The matrix always carries ubuntu-latest first, then one job per operating
# system the `@env` tags in specs/ name; a project that tags nothing runs on
# ubuntu-latest alone. An untagged proof is satisfied by any operating system,
# so the Linux job proves those. Each job runs the same tests a person runs
# and writes its own section, merged into the file at the branch's head, so
# two jobs never overwrite each other.
#
# The job is capped at 90 minutes. GitHub cancels a job at 6 hours and
# keeps nothing, so a run that stops for something cannot be read; 90 minutes
# is longer than any suite this runs and short enough to leave a log worth
# reading. The run caps each arm at an hour of its own.
name: purlin

on:
  push:
    branches: ['run/**']
    tags: ['signed/**']

permissions:
  contents: write

jobs:
  purlin:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [<<MATRIX>>]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # This repository is its own plugin, so a checkout that already carries
      # scripts/run/purlin_run.py is the Purlin to run. A consumer project
      # installed Purlin from the marketplace and its runner has no plugin, so
      # the job clones the release the project pins. Set the PURLIN_REF
      # repository variable to move that pin without editing this file.
      - name: Locate Purlin
        shell: bash
        run: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "PURLIN_ROOT=$PWD" >> "$GITHUB_ENV"
          else
            ref="${{ vars.PURLIN_REF }}"
            if [ -z "$ref" ]; then ref="<<PURLIN_REF>>"; fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$RUNNER_TEMP/purlin"
            echo "PURLIN_ROOT=$RUNNER_TEMP/purlin" >> "$GITHUB_ENV"
          fi

      # What each framework needs before its tests run. A project with none of
      # these files installs nothing and the step is a no-op. A project whose
      # tests drive a browser through playwright also needs the browser:
      # `--with-deps` installs the libraries a Linux runner lacks and does
      # nothing on Windows and macOS.
      - name: Set up the test framework
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          if [ -f conftest.py ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python3 -m pip install pytest
          fi
          if python3 -c "import playwright" 2>/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi
          if [ -f package.json ]; then npm ci; fi

      - name: Run the tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "$PURLIN_ROOT/scripts/run/purlin_run.py" --all --ci

      # The last word of every run. The gate check exits 1 when a rule does
      # not meet the gate or when a committed signature no longer hashes to
      # this code, which fails this job.
      - name: Check the gate
        shell: bash
        run: python3 "$PURLIN_ROOT/scripts/ci/gate_check.py" --check --verify

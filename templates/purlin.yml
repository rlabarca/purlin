# Purlin runs here, where the evidence it writes is decided.
#
# purlin:init writes this file and purlin:init --update refreshes it. Three
# things start a run and nothing else does: a pull request, a push to the
# protected branch, and a push to a `run/*` branch, which is the branch
# `purlin:test --remote` creates and deletes around one run. A push to any
# other branch starts nothing, so a feature branch costs no runner minutes
# until it is opened as a pull request.
#
# What a run writes depends on the gate and on where it runs. At `passed` it
# runs the tagged tests, posts the comment and uploads the dashboard, and
# writes no record: the test results a person commits are the evidence there.
# At `strong` and above it audits what it ran and writes one record per
# feature, plus the briefs. A pull request run commits nothing either way: the
# records would land on a branch nobody merges from. A run on the protected
# branch, or on a `run/*` branch, commits them there.
#
# Every run ends with the gate check, and the job fails when the gate is not
# met, so a required check on this workflow means the gate held.
#
# The matrix always carries ubuntu-latest first, then one job per operating
# system the `@env` tags in specs/ name; a project that tags nothing runs on
# ubuntu-latest alone. An untagged proof is satisfied by any operating system,
# so the Linux job proves those and writes the record that counts. Each job
# runs the same tests a person runs and writes its own record, so two jobs
# never write the same file name. The artifact each job uploads carries the
# runner in its name for the same reason: one name for two jobs keeps only what
# the job that finished last uploaded.
#
# A pull request from a fork gets a run and a comment and no commit: GitHub
# gives a forked pull request a read-only token, and the job says so.
#
# The job is capped at 90 minutes. GitHub cancels a job at 6 hours and
# keeps nothing, so a run that stops for something cannot be read; 90 minutes
# is longer than any suite this runs and short enough to leave a log worth
# reading. The run caps each arm at an hour of its own.
name: purlin

on:
  pull_request:
  push:
    branches: [<<PROTECTED>>, 'run/**']
# BEGIN upstream-check
  schedule:
    - cron: '17 6 * * 1'
# END upstream-check

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [<<MATRIX>>]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # This repository is its own plugin, so a checkout that already carries
      # scripts/run/purlin_run.py is the Purlin to run. A consumer project
      # installed Purlin from the marketplace and its runner has no plugin, so
      # the job clones the release the project pins. Set the PURLIN_REF
      # repository variable to move that pin without editing this file.
      - name: Locate Purlin
        shell: bash
        run: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "PURLIN_ROOT=$PWD" >> "$GITHUB_ENV"
          else
            ref="${{ vars.PURLIN_REF }}"
            if [ -z "$ref" ]; then ref="<<PURLIN_REF>>"; fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$RUNNER_TEMP/purlin"
            echo "PURLIN_ROOT=$RUNNER_TEMP/purlin" >> "$GITHUB_ENV"
          fi

      # What each framework needs before its tests run. A project with none of
      # these files installs nothing and the step is a no-op. A project whose
      # tests drive a browser through playwright also needs the browser:
      # `--with-deps` installs the libraries a Linux runner lacks and does
      # nothing on Windows and macOS.
      - name: Set up the test framework
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          if [ -f conftest.py ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python3 -m pip install pytest
          fi
          if python3 -c "import playwright" 2>/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi
          if [ -f package.json ]; then npm ci; fi

      - name: Run the tests and write the evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "$PURLIN_ROOT/scripts/run/purlin_run.py" --all --ci

      - name: Say that a forked pull request writes no commit
        if: github.event.pull_request.head.repo.fork
        shell: bash
        run: |
          echo "This pull request comes from a fork. The run and the comment"
          echo "happened; no record was committed."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purlin-dashboard-${{ matrix.os }}
          path: ${{ runner.temp }}/purlin-dashboard
          if-no-files-found: ignore

      # The last word of every run. The gate check exits 1 when a rule does
      # not meet the gate, which fails this job, which is what a required
      # check on this workflow means.
      - name: Check the gate
        shell: bash
        run: python3 "$PURLIN_ROOT/scripts/ci/gate_check.py" --check
# BEGIN upstream-check
  upstream-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate Purlin
        shell: bash
        run: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "PURLIN_ROOT=$PWD" >> "$GITHUB_ENV"
          else
            ref="${{ vars.PURLIN_REF }}"
            if [ -z "$ref" ]; then ref="<<PURLIN_REF>>"; fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$RUNNER_TEMP/purlin"
            echo "PURLIN_ROOT=$RUNNER_TEMP/purlin" >> "$GITHUB_ENV"
          fi

      # One issue when an anchor pin is behind its source, and nothing when
      # every pin is current.
      - name: Open an issue when an anchor pin is behind
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=$(python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.path.join(os.environ["PURLIN_ROOT"],
                                          "scripts", "mcp"))
          from purlin import drift, specs
          rows = drift.pin_report(".", specs.scan_specs("."))
          for row in rows:
              if row.get("status") != "current":
                  print("%s: the pin %s is behind its source. Run "
                        "purlin:anchor sync %s."
                        % (row["anchor"], (row.get("pinned") or "")[:7],
                           row["anchor"]))
          PY
          )
          if [ -n "$behind" ]; then
            gh issue create --title "Purlin: an anchor pin is behind its source" \
              --body "$behind"
          else
            echo "Every anchor pin is current."
          fi
# END upstream-check

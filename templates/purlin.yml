# Purlin runs here, on a clean machine, for one reason: a rule that must hold
# on an operating system your machine is not.
#
# The first purlin:test --remote writes this file where a proof in specs/ is
# tagged @env for such a system. The matrix holds one job for each operating
# system a proof in specs/ is tagged @env for that the machine writing the file
# is not, and no other.
#
# One thing starts a run and nothing else does: a push to a `run/*` branch,
# which is the branch purlin:test --remote creates and deletes around one run.
# A push to any other branch starts nothing, a tag starts nothing, and a pull
# request starts nothing.
#
# A run runs the marked tests of the proofs tagged @env for the runner's own
# operating system, writes that system's section of
# .purlin/evidence/ci/<feature>.json for every feature it covered, and commits
# it on the run branch, where purlin:test --remote pulls it home. Each job
# writes its own section, merged into the file at the branch's head, so two
# jobs never overwrite each other.
#
# The test step is the last step. It ends by printing the summary and Left to
# do, and its exit code is the job's: the job fails only when a test fails or
# could not run.
#
# No breaks and no AI audit run here. purlin:audit does both on a person's
# machine.
#
# The job is capped at 90 minutes. GitHub cancels a job at 6 hours and
# keeps nothing, so a run that stops for something cannot be read; 90 minutes
# is longer than any suite this runs and short enough to leave a log worth
# reading. The run caps each test command at an hour of its own.
name: purlin

on:
  push:
    branches: ['run/**']

permissions:
  contents: write

jobs:
  purlin:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [<<MATRIX>>]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # This repository is its own plugin, so a checkout that already carries
      # scripts/run/purlin_run.py is the Purlin to run. A consumer project
      # installed Purlin from the marketplace and its runner has no plugin, so
      # the job clones the release the project pins. Set the PURLIN_REF
      # repository variable to move that pin without editing this file.
      - name: Locate Purlin
        shell: bash
        run: |
          if [ -f scripts/run/purlin_run.py ]; then
            echo "PURLIN_ROOT=$PWD" >> "$GITHUB_ENV"
          else
            ref="${{ vars.PURLIN_REF }}"
            if [ -z "$ref" ]; then ref="<<PURLIN_REF>>"; fi
            git clone --depth 1 --branch "$ref" \
              https://github.com/rlabarca/purlin "$RUNNER_TEMP/purlin"
            echo "PURLIN_ROOT=$RUNNER_TEMP/purlin" >> "$GITHUB_ENV"
          fi

      # What each framework needs before its tests run. A project with none of
      # these files installs nothing and the step is a no-op. A project whose
      # tests drive a browser through playwright also needs the browser:
      # `--with-deps` installs the libraries a Linux/Unix runner lacks and does
      # nothing on Windows and macOS.
      - name: Set up the test framework
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          if [ -f conftest.py ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python3 -m pip install pytest
          fi
          if python3 -c "import playwright" 2>/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi
          if [ -f package.json ]; then npm ci; fi

      - name: Run the tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "$PURLIN_ROOT/scripts/run/purlin_run.py" --all --ci
